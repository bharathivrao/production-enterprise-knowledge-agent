name: production-enterprise-knowledge-agent
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: postgres_vector_db
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: knowledge_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: knowledge_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_agent -d knowledge_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["python", "-m", "app.db.migrations"]
    env_file:
      - path: .env
        required: false
    environment: &app_environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: knowledge_agent
      POSTGRES_USER: knowledge_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OLLAMA_HOST: ${OLLAMA_HOST_CONTAINER:-http://host.docker.internal:11434}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *app_environment
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/liveness', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
    # Preserve the database volume created by the previous Compose project name.
    name: production-enterprise-knowledge-agent-_postgres_data
