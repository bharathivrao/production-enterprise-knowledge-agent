name: production-enterprise-knowledge-agent-
services:
  db:
    image: pgvector/pgvector:pg17  # Official image with pgvector pre-installed
    container_name: postgres_vector_db
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: knowledge_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: knowledge_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_agent -d knowledge_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
