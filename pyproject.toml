[project]
name = "production-enterprise-knowledge-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "openai>=3.22.1",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires the local PostgreSQL/pgvector service",
]
